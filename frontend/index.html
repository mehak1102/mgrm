<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem("mgrm-theme") ||
            localStorage.getItem("mgrm-color-mode") ||
            localStorage.getItem("mgrm_theme");
          var theme = stored === "light" || stored === "dark" || stored === "blue" ? stored : null;
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var tokens = {
            light: {
              "bg-primary": "#ffffff",
              "bg-secondary": "#f7f8fb",
              "card-bg": "#ffffff",
              "card-hover": "#f1f5f9",
              "border-color": "#e2e8f0",
              "accent-primary": "#25319a",
              "accent-secondary": "#22a7dc",
              "text-primary": "#0f172a",
              "text-secondary": "#64748b",
            },
            dark: {
              "bg-primary": "#020617",
              "bg-secondary": "#0f172a",
              "card-bg": "#18181b",
              "card-elevated": "#111827",
              "card-hover": "#27272a",
              "border-color": "rgba(255, 255, 255, 0.1)",
              "accent-primary": "#22d3ee",
              "accent-secondary": "#3b82f6",
              "text-primary": "#fafafa",
              "text-secondary": "#a1a1aa",
              "text-muted": "#71717a",
              "text-accent": "#67e8f9",
              primary: "#25319a",
              accent: "#22a7dc",
              soft: "#18181b",
              bg1: "#09090b",
              border: "#3f3f46",
              text: "#fafafa",
            },
            blue: {
              "bg-primary": "#003262",
              "bg-secondary": "#00284E",
              "bg-elevated": "#003875",
              "card-bg": "rgba(255, 255, 255, 0.84)",
              "card-elevated": "rgba(255, 255, 255, 0.90)",
              "card-hover": "rgba(255, 255, 255, 0.92)",
              "card-border": "rgba(255, 255, 255, 0.28)",
              "border-color": "rgba(255, 255, 255, 0.12)",
              "accent-primary": "#003262",
              "accent-secondary": "#FFD700",
              "accent-soft": "rgba(255, 215, 0, 0.12)",
              "action-primary": "#FFD700",
              "text-primary": "#FFFFFF",
              "text-secondary": "rgba(255, 255, 255, 0.90)",
              "text-muted": "rgba(255, 255, 255, 0.74)",
              "text-accent": "#FFD700",
              "gradient-from": "#003262",
              "gradient-via": "#003262",
              "gradient-to": "#00284E",
              primary: "#003262",
              accent: "#FFD700",
              soft: "rgba(255, 215, 0, 0.12)",
              bg1: "#003262",
              border: "rgba(255, 255, 255, 0.12)",
              text: "#FFFFFF",
            },
          };
          var t = tokens[theme] || tokens.light;
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (theme === "dark") root.classList.add("dark");
          root.style.colorScheme = theme === "dark" ? "dark" : "light";
          Object.keys(t).forEach(function (k) {
            root.style.setProperty("--" + k, t[k]);
          });
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGRM-Medicare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
